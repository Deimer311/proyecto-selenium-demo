<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Demo</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
    }
    .card {
      background: white;
      padding: 44px 52px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      color: #0f172a;
      font-size: 20px;
      font-weight: 600;
    }
    p {
      color: #64748b;
      margin: 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bienvenido</h1>
    <p>Sesión iniciada correctamente.</p>
  </div>
</body>
</html>
