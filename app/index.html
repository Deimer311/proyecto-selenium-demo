<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Iniciar sesión - Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 360px;
      padding: 40px 36px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    .card h1 {
      margin: 0 0 4px;
      font-size: 21px;
      color: #0f172a;
      font-weight: 600;
    }
    .subtitulo {
      margin: 0 0 28px;
      color: #64748b;
      font-size: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    input {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.15s;
    }
    input:focus {
      outline: none;
      border-color: #334155;
    }
    .login-btn {
      width: 100%;
      background: #0f172a;
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .login-btn:hover {
      background: #1e293b;
    }
    .error-message {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 10px 12px;
      border-radius: 6px;
      display: none;
      margin-top: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Ingresa tus credenciales para continuar</p>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" placeholder="correo@ejemplo.com" />

    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="Contraseña" />

    <button class="login-btn" onclick="iniciarSesion()">Ingresar</button>
    <p class="error-message"></p>
  </div>

  <script>
    function iniciarSesion() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.querySelector('.error-message');

      // Credenciales válidas simuladas para el demo
      if (email === 'cliente@gmail.com' && password === '123456') {
        window.location.href = 'dashboard.html';
      } else {
        errorMsg.textContent = 'Credenciales inválidas, intenta de nuevo';
        errorMsg.style.display = 'block';
      }
    }
  </script>
</body>
</html>
